services:
  app:
    build: .
    ports:
      - "${PORT:-3333}:3333"
    env_file:
      - .env
    command: sh -c "npx prisma migrate deploy && node dist/server.js"
    depends_on:
      - db

  db:
    image: postgres:15
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: